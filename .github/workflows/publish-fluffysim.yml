name: Release FluffySim
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fluffysim-publication
  cancel-in-progress: false
jobs:
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-2022
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Verify tag and source
        shell: pwsh
        run: |
          [xml]$props = Get-Content FluffySim.Version.props
          $expected = "v$($props.Project.PropertyGroup.FluffySimVersion).0"
          if ($env:GITHUB_REF_NAME -ne $expected) { throw "Tag must be $expected" }
          git fetch origin master:refs/remotes/origin/master
          git merge-base --is-ancestor HEAD origin/master
          if ($LASTEXITCODE -ne 0) { throw 'Tag must belong to published master history' }
          $catalog = Get-Content AnoMech/Scenarios/ScenarioCatalog.cs -Raw
          $requiredScenarios = @('FruFallOfFaithScenario', 'FruLightRampantScenario', 'FruUltimateRelativityScenario', 'FruApocalypseScenario', 'FruDarklitScenario', 'DsrStrengthScenario', 'DsrStrength2Scenario', 'DsrSanctity1Scenario', 'DsrSanctity2Scenario')
          foreach ($scenario in $requiredScenarios) {
            if ($catalog -notmatch "new\s+[\w.]*$scenario\s*\(") { throw "Missing registered scenario: $scenario" }
          }
      - name: Download Dalamud
        shell: pwsh
        run: |
          Invoke-WebRequest https://goatcorp.github.io/dalamud-distrib/latest.zip -OutFile latest.zip
          Expand-Archive latest.zip "$env:AppData\XIVLauncher\addon\Hooks\dev"
      - run: python -m unittest discover -s tools/tests -p test_package_release.py
      - run: python -m unittest discover -s tools/tests -p test_release_notes.py
      - run: dotnet build -c Debug
      - name: Run optimized Debug scenario tests
        run: >
          dotnet test tests/AnoMech.Tests -c Debug -p:Optimize=true
          -p:OutputPath="${{ github.workspace }}/tests/AnoMech.Tests/bin/fast-Debug/"
          -p:IntermediateOutputPath=obj/fast-tests-Debug/
      - run: dotnet test tests/AnoMech.Relay.Tests -c Debug
      - name: Build optimized Debug safety artifact
        run: dotnet build AnoMech/AnoMech.csproj -c Debug -p:Optimize=true -p:DefineConstants=TRACE -p:OutputPath=${{ github.workspace }}/artifacts/safety/ -p:IntermediateOutputPath=obj/safety-Debug/
      - name: Safety checks
        env:
          ANOMECH_DLLS: ${{ github.workspace }}\artifacts\safety\FluffySim.dll;${{ github.workspace }}\AnoMech\bin\x64\Debug\FluffySim.dll
        run: dotnet test tests/SafetyTests -c Debug
      - name: SafetyHook checks
        env:
          ANOMECH_DLLS: ${{ github.workspace }}\artifacts\safety\FluffySim.dll;${{ github.workspace }}\AnoMech\bin\x64\Debug\FluffySim.dll
          ANOMECH_HOOK_BACKEND: safetyhook
        run: dotnet test tests/SafetyTests -c Debug --no-build
      - name: Build Release on isolated runner only
        run: dotnet build -c Release
      - run: python tools/package_release.py --input AnoMech/bin/x64/Release --output dist
      - name: Publish once; retries reuse immutable asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          asset="FluffySim-${GITHUB_REF_NAME#v}.zip"
          python tools/release_notes.py --version "${GITHUB_REF_NAME#v}" --output dist/release-notes.md
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            mkdir existing
            gh release download "$GITHUB_REF_NAME" --pattern "$asset" --dir existing
          else
            gh release create "$GITHUB_REF_NAME" "dist/$asset" --verify-tag --notes-file dist/release-notes.md --title "FluffySim ${GITHUB_REF_NAME#v}"
            mkdir existing
            gh release download "$GITHUB_REF_NAME" --pattern "$asset" --dir existing
          fi
      - name: Verify release is public and stable
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY" --jq .private | grep -qx false
          gh release view "$GITHUB_REF_NAME" --json isDraft,isPrerelease --jq '(.isDraft == false) and (.isPrerelease == false)' | grep -qx true
      - name: Checkout metadata repository
        uses: actions/checkout@v5
        with:
          repository: KathyAuteberry/plogons
          ref: master
          token: ${{ secrets.PLOGONS_TOKEN }}
          path: manifest-repo
      - run: python -m unittest discover -s manifest-repo/tools/tests
      - name: Update metadata from published asset
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            git -C manifest-repo pull --ff-only
            python manifest-repo/tools/update_manifest.py --zip "existing/FluffySim-${GITHUB_REF_NAME#v}.zip" --version "${GITHUB_REF_NAME#v}"
            if git -C manifest-repo diff --quiet; then exit 0; fi
            git -C manifest-repo config user.name github-actions[bot]
            git -C manifest-repo config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git -C manifest-repo add mostly-harmless.json
            git -C manifest-repo commit -m "chore(release): publish FluffySim ${GITHUB_REF_NAME#v} metadata"
            if git -C manifest-repo push origin HEAD:master; then exit 0; fi
            git -C manifest-repo fetch origin master
            git -C manifest-repo reset --hard origin/master
          done
          exit 1
