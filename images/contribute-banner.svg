<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 200" width="900" height="200" role="img" aria-labelledby="title desc">
  <title id="title">Would you like to see more fights in FluffySim?</title>
  <desc id="desc">Send bug reports and fight recordings. Click to read how to help.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c1236"/>
      <stop offset="1" stop-color="#1d0d3d"/>
    </linearGradient>
    <linearGradient id="button" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff4fd8"/>
      <stop offset="1" stop-color="#9a5cff"/>
    </linearGradient>
    <radialGradient id="floor" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#1b3a8a" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#0c1236" stop-opacity="0.2"/>
    </radialGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow" x="-10%" y="-40%" width="120%" height="180%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="arena"><ellipse cx="160" cy="118" rx="122" ry="54"/></clipPath>
    <symbol id="cat" viewBox="-12 -14 24 26">
      <path d="M-10 -2 L-9 -13 L-3 -7 Q0 -8 3 -7 L9 -13 L10 -2 Q11 10 0 10 Q-11 10 -10 -2 Z"/>
      <circle cx="-4" cy="1" r="1.8" fill="#0c1236"/>
      <circle cx="4" cy="1" r="1.8" fill="#0c1236"/>
    </symbol>
    <path id="sparkle" d="M0 -10 Q1.5 -1.5 10 0 Q1.5 1.5 0 10 Q-1.5 1.5 -10 0 Q-1.5 -1.5 0 -10 Z"/>
  </defs>

  <rect x="3" y="3" width="894" height="194" rx="22" fill="url(#bg)"/>
  <rect x="3" y="3" width="894" height="194" rx="22" fill="none" stroke="#3fd2ff" stroke-width="3" filter="url(#glow)"/>

  <!-- arena -->
  <ellipse cx="160" cy="118" rx="122" ry="54" fill="url(#floor)"/>
  <g clip-path="url(#arena)" stroke="#3fd2ff" stroke-opacity="0.35" stroke-width="1">
    <path d="M38 88 H282 M38 103 H282 M38 118 H282 M38 133 H282 M38 148 H282"/>
    <path d="M70 60 L50 176 M110 60 L100 176 M160 60 V176 M210 60 L220 176 M250 60 L270 176"/>
  </g>
  <ellipse cx="160" cy="118" rx="122" ry="54" fill="none" stroke="#3fd2ff" stroke-width="3" filter="url(#glow)"/>
  <ellipse cx="160" cy="118" rx="136" ry="62" fill="none" stroke="#3fd2ff" stroke-opacity="0.45" stroke-width="1.5"/>
  <ellipse cx="160" cy="112" rx="34" ry="15" fill="#ff3ea5" fill-opacity="0.25" stroke="#ff4fd8" stroke-width="2.5" filter="url(#glow)"/>
  <ellipse cx="200" cy="146" rx="30" ry="12" fill="#ff3e6c" fill-opacity="0.22" stroke="#ff4f7b" stroke-width="2" filter="url(#glow)"/>

  <!-- dodges -->
  <g fill="none" stroke="#e8f6ff" stroke-width="2.5" stroke-dasharray="6 5" stroke-linecap="round">
    <path d="M86 124 Q96 108 116 104"/>
    <path d="M232 98 Q252 112 240 134"/>
  </g>
  <path d="M116 104 l-8 -4 l1 8 Z M240 134 l-1 -9 l8 4 Z" fill="#e8f6ff"/>

  <!-- party -->
  <g filter="url(#glow)">
    <use href="#cat" x="62" y="114" width="28" height="30" fill="#2f6bff"/>
    <use href="#cat" x="218" y="78" width="28" height="30" fill="#ffd23f"/>
    <use href="#cat" x="236" y="128" width="28" height="30" fill="#2bd86b"/>
    <use href="#cat" x="146" y="88" width="28" height="30" fill="#c66bff"/>
  </g>

  <!-- sparkles -->
  <g fill="#ffd23f" filter="url(#glow)">
    <use href="#sparkle" transform="translate(40 44) scale(1.3)"/>
    <use href="#sparkle" transform="translate(276 40) scale(0.9)"/>
    <use href="#sparkle" transform="translate(860 40) scale(1.1)"/>
    <use href="#sparkle" transform="translate(842 166) scale(0.7)"/>
  </g>
  <use href="#sparkle" transform="translate(300 160) scale(0.8)" fill="#ff8af0" filter="url(#glow)"/>

  <!-- text -->
  <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
    <text x="330" y="78" font-size="33" font-weight="800" fill="#ffffff" filter="url(#softglow)">Want more fights in FluffySim?</text>
    <text x="330" y="112" font-size="18" fill="#bfe9ff">No code needed: send bug reports and recordings of your pulls.</text>
    <rect x="330" y="132" width="214" height="40" rx="20" fill="url(#button)" filter="url(#glow)"/>
    <text x="437" y="158" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">Here's how to help ➜</text>
  </g>
</svg>
